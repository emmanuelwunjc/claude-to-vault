name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck; else sudo apt-get update && sudo apt-get install -y shellcheck; fi
          fi
          shellcheck -x lib/vault-lib.sh hooks/session-end.sh bin/ctv-backfill install.sh test/selftest.sh test/integration.sh

      - name: selftest
        run: ./test/selftest.sh

      - name: integration (stub CLI, no tokens spent)
        run: ./test/integration.sh

      - name: bash 3.2 parse check (macOS ships 3.2, not 4+)
        if: runner.os == 'macOS'
        run: /bin/bash -n lib/vault-lib.sh hooks/session-end.sh bin/ctv-backfill install.sh test/selftest.sh test/integration.sh

      - name: install is idempotent and does not clobber existing hooks
        run: |
          set -euo pipefail
          export HOME="$PWD/.citmp"; mkdir -p "$HOME/.claude"
          # A pre-existing hook from some other tool. Must survive install AND uninstall.
          cat > "$HOME/.claude/settings.json" <<'JSON'
          {"model":"opus","hooks":{"SessionEnd":[{"hooks":[{"type":"command","command":"/other/tool.sh"}]}]}}
          JSON
          ./install.sh --vault "$HOME/vault"
          ./install.sh --vault "$HOME/vault"   # twice: must not double-wire
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ["HOME"] + "/.claude/settings.json"))
          cmds = [h["command"] for g in d["hooks"]["SessionEnd"] for h in g["hooks"]]
          assert d["model"] == "opus", "unrelated settings were lost"
          assert "/other/tool.sh" in cmds, "someone else's hook was dropped"
          assert sum("session-end.sh" in c for c in cmds) == 1, f"expected exactly one wiring, got {cmds}"
          print("install ok:", cmds)
          PY
          ./install.sh --uninstall
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ["HOME"] + "/.claude/settings.json"))
          cmds = [h["command"] for g in d.get("hooks", {}).get("SessionEnd", []) for h in g["hooks"]]
          assert cmds == ["/other/tool.sh"], f"uninstall did not leave the other hook alone: {cmds}"
          assert d["model"] == "opus"
          print("uninstall ok:", cmds)
          PY

      - name: hook exits fast and never blocks a session
        run: |
          set -euo pipefail
          export HOME="$PWD/.citmp2"; mkdir -p "$HOME"
          # No claude CLI on the runner, so the worker aborts. The entry path
          # must still return immediately and exit 0, or it would hang Claude Code.
          echo '{"transcript_path":"/nope.jsonl","session_id":"x"}' | timeout 10 ./hooks/session-end.sh
          echo "hook returned $?"
